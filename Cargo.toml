[package]
name = "paper-radar"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1.0.104"
async-trait = "0.1.92"
chrono = "0.4.45"
chrono-tz = "0.10.4"
clap = { version = "4.6.7", features = ["derive"] }
dotenvy = "0.15.7"
feed-rs = "3.0.0"
loop-agent = { git = "https://github.com/soketlabs/loop", tag = "v0.5.0", version = "0.5.0" }
loop-ai = { git = "https://github.com/soketlabs/loop", tag = "v0.5.0", version = "0.5.0" }
reqwest = { version = "0.13.5", default-features = false, features = ["rustls"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
slack-morphism = { version = "2.31.1", features = ["hyper"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["full"] }
toml = "1.1.8"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
url = "2.5.8"
